uid: SR-0007
type: system_requirement
status: approved
title: Prefer native controls for built-in keyboard support
text: >-
  Build interactive controls from native elements such as button, a, input and select,
  which are focusable and keyboard-operable by default, rather than adding behaviour to a
  div or span.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "MDN Web Docs: Accessibility — Native Controls"
