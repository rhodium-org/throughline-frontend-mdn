uid: SR-0018
type: system_requirement
status: approved
title: Only add tabindex=0 to custom controls, never a positive value
text: >-
  Add tabindex='0' only to make a genuinely custom control focusable, use tabindex='-1'
  for programmatic focus, and never use a positive tabindex, which breaks the natural tab
  order.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "MDN Web Docs: Accessibility — Focus Order"
