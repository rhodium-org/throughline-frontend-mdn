uid: SR-0026
type: system_requirement
status: proposed
title: Include the viewport meta tag
text: Add the meta viewport tag with content='width=device-width, initial-scale=1'
  so mobile browsers render the page at the device's width rather than a zoomed-out
  desktop width.
normative: true
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: 'MDN Web Docs: Responsive Design — Viewport'
